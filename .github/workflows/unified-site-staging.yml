name: Unified site staging checks

on:
  push:
    branches:
      - phase-1-unified-site
      - phase-3-release-candidate
      - main
      - fix/require-public-event-description-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Sunday-inclusive weekly agenda, stated meetings and new events
        run: node tests/weekly-agenda-smoke.mjs
      - name: Test gated newsletter and subscriber lifecycle
        run: node tests/newsletter-smoke.mjs
      - name: Validate required public event descriptions (read only)
        run: node tests/public-description-required-smoke.mjs
      - name: Validate navigation, assets, JavaScript, and security boundaries
        run: node tests/site-smoke.mjs
      - name: Verify email OTP request, code exchange, and MFA boundaries
        run: node tests/email-otp-smoke.mjs
      - name: Test Home Screen installation guides and route-specific PWA names
        run: node tests/install-guides-smoke.mjs
      - name: Test User/Admin access-level labels without changing stored roles
        run: node tests/access-level-label-smoke.mjs
      - name: Test Inspector at Large district assignment and access boundaries
        run: node tests/inspector-at-large-smoke.mjs
      - name: Test fixed Division and District School of Instruction title rules
        run: node tests/soi-title-smoke.mjs
      - name: Test individual Google, Apple, and Outlook event export
        run: node tests/individual-event-calendar-smoke.mjs
      - name: Test Google Calendar publishing title and notes
        run: node tests/calendar-publishing.mjs
      - name: Test Inspector Desk Excel import integration
        run: node tests/bulk-import-smoke.mjs
      - name: Check simplified Inspector Desk layout
        run: node tests/inspector-layout-smoke.mjs
      - name: Check consistent public and private navigation
        run: node tests/shared-navigation-smoke.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out staging
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser smoke test dependency
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test public pages, inspector login route and mobile menu
        run: node tests/browser-smoke.mjs
      - name: Verify live website, backend access boundaries and responsive layout (read-only)
        if: github.ref == 'refs/heads/main'
        run: node tests/live-site-smoke.mjs
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-site-staging-screenshots
          path: test-results/
          if-no-files-found: ignore
